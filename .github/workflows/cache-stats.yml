name: Cache · GitHub Stats SVGs

# Renders the GitHub Stats and Top-Languages cards from the GitHub
# GraphQL API (scripts/stats-cards.mjs) and commits them under assets/
# so the README is fully self-contained (no third-party stats service).

on:
  schedule:
    # Mondays at 06:00 UTC
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/stats-cards.mjs'
      - '.github/workflows/cache-stats.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache:
    name: Refresh stats SVGs in assets/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Render stats cards
        run: node scripts/stats-cards.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit changes (if any)
        run: |
          if [[ -n "$(git status --porcelain assets/stats-*.svg)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/stats-overview.svg assets/stats-langs.svg
            git commit -m "chore(stats): refresh cached GitHub stats SVGs"
            git push
          else
            echo "Stats SVGs are unchanged — nothing to commit."
          fi
